<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Security Firewall Warning</title>
  <style>
    body {
      background: #121316;
      color: #f1f3f5;
      font-family: system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: #1a1b1e;
      border: 1px solid #e03131;
      border-radius: 12px;
      padding: 32px;
      max-width: 480px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    h1 { color: #ff6b6b; font-size: 22px; margin-bottom: 12px; }
    p { color: #adb5bd; font-size: 14px; line-height: 1.5; margin-bottom: 20px; }
    code {
      display: block;
      background: #121316;
      padding: 10px;
      border-radius: 6px;
      color: #ffd43b;
      word-break: break-all;
      margin-bottom: 24px;
    }
    .actions { display: flex; gap: 12px; justify-content: center; }
    button {
      padding: 10px 18px;
      border-radius: 6px;
      border: none;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-safe { background: #2b8a3e; color: #fff; }
    .btn-proceed { background: #25262b; color: #adb5bd; }
  </style>
</head>
<body>
  <div class="card">
    <h1>⚠️ Suspicious Page Blocked</h1>
    <p>LocalShield Firewall paused this page before loading because it matches known ad-redirect or trojan distribution patterns.</p>
    <code id="targetUrlDisplay"></code>
    <div class="actions">
      <button id="goBackBtn" class="btn-safe">Go Back Safely</button>
      <button id="proceedBtn" class="btn-proceed">Proceed Anyway</button>
    </div>
  </div>
  <script src="warning.js"></script>
</body>
</html>
