<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LocalShield</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header class="header">
      <div class="brand">
        <span class="shield" aria-hidden="true">⬡</span>
        <strong>LocalShield</strong>
      </div>
      <button id="powerBtn" class="status-pill active" title="Toggle LocalShield" aria-label="Toggle LocalShield">
        <span id="statusText">Protected</span>
      </button>
    </header>
    <section class="stats-container">
      <div class="stat-box"><div id="adsBlockedCount" class="stat-number">0</div><div class="stat-label">Ads blocked</div></div>
      <div class="stat-box"><div id="popupsBlockedCount" class="stat-number">0</div><div class="stat-label">Pop-ups blocked</div></div>
    </section>
    <section class="recent-heading"><strong>Recent blocked requests</strong><span>Latest 3</span></section>
    <div id="recentAds" class="recent-list" aria-live="polite"></div>
    <section class="ai-summary" aria-label="Explainable AI URL review">
      <div class="ai-title"><strong>Explainable AI · URL review</strong><span>Experimental</span></div>
      <div id="aiReview" class="ai-body">Visit a website to see its URL-pattern score.</div>
    </section>
    <button id="openHistoryBtn" class="history-btn">↗ &nbsp; Open Full Activity Log</button>
    <p class="footnote">The rules block ads. AI scores URL patterns and explains its contributions; it does not verify malware.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
