<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LocalShield</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <span class="title">LocalShield</span>
    <button id="closeBtn" class="close-btn" title="Close UI">&times;</button>
  </div>

  <div class="power-container">
    <button id="powerBtn" class="power-btn active" title="Toggle AdBlock ON/OFF">
      <svg viewBox="0 0 24 24" width="36" height="36" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
        <line x1="12" y1="2" x2="12" y2="12"></line>
      </svg>
    </button>
    <span id="statusText" class="status-text">PROTECTED</span>
  </div>

  <div class="stats-container">
    <div class="stat-box">
      <span id="adsBlockedCount" class="stat-number">0</span>
      <span class="stat-label">Ads Blocked</span>
    </div>
    <div class="stat-box">
      <span id="popupsBlockedCount" class="stat-number">0</span>
      <span class="stat-label">Pop-ups Blocked</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
